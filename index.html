<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Melek AI 🌸</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#fdf2f8">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              300: '#f9a8d4',
              400: '#f472b6',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50 to-pink-100 min-h-screen font-sans text-slate-800 pb-28">

  <!-- ÜST HEADER / HEDEF KARTI -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-pink-100 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-200">
          <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-bold text-base text-pink-900 leading-tight">Melek AI</h1>
            <span class="text-xs">🌸</span>
          </div>
          <p class="text-[11px] font-semibold text-pink-600">Tarsus Üni • Çocuk Gelişimi</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="openApiKeyModal()" id="apiKeyStatusBtn" class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center text-xs hover:bg-pink-200 transition" title="API Ayarı">
          <i class="fa-solid fa-key"></i>
        </button>
        <div class="bg-gradient-to-r from-pink-100 to-rose-100 px-3 py-1 rounded-full border border-pink-200 flex items-center gap-1.5">
          <i class="fa-solid fa-bullseye text-pink-600 text-xs"></i>
          <span class="text-xs font-bold text-pink-800">Hedef: 55 Net</span>
        </div>
      </div>
    </div>
  </header>

  <!-- İÇERİK ALANI -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- 1. SEKME: KAMERA İLE SORU ÇÖZ -->
    <section id="tab-scan" class="tab-content space-y-4">
      
      <!-- Soru Yükleme / Çekme Alanı -->
      <div class="bg-white/90 backdrop-blur rounded-3xl p-5 border border-pink-100 shadow-sm text-center">
        <div id="imagePreviewContainer" class="hidden mb-4 relative rounded-2xl overflow-hidden border-2 border-pink-200 shadow-inner max-h-80 bg-slate-50 flex items-center justify-center">
          <img id="imagePreview" src="" alt="Soru Önizleme" class="w-full object-contain max-h-72">
          <button onclick="clearImage()" class="absolute top-2 right-2 w-8 h-8 bg-black/60 text-white rounded-full flex items-center justify-center text-xs backdrop-blur-sm">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="uploadPrompt" class="py-6 border-2 border-dashed border-pink-200 rounded-2xl bg-pink-50/40 flex flex-col items-center justify-center gap-2">
          <div class="w-14 h-14 rounded-full bg-pink-100 text-pink-500 flex items-center justify-center text-2xl shadow-inner">
            <i class="fa-solid fa-camera"></i>
          </div>
          <p class="font-bold text-sm text-pink-900 mt
